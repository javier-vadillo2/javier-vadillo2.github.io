<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>

<body>

    <!-- CABECERA -->
    <header>
        <h1>Formulario</h1>
        <p>Aquí un formulario con 12 tipos de inputs</p>
    </header>

    <!-- Menú de navegación -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="cv.html">Currículum</a>
        <a href="formulario.html">Formulario</a>
        <a href="sobreelproyecto.html">Sobre el proyecto</a>
    </nav>

    <!-- Barra lateral -->
    <aside>
        <h3>Sobre mí</h3>
        <p>Estudiante de desarrollo apasionado por la tecnología, la música y los videojuegos.</p>
    </aside>

    <!--Formulario-->
    <main>
        <div class="container">
            <div class="form-header">
                <h1>Formulario de registro</h1>
            </div>
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" min="18" max="100">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                <div class="form-group">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero">
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="color">Color favorito</label>
                    <input class="color" type="color">
                </div>
                <div class="form-group">
                    <label for="tiempo">Hora a la que se rellena el formulario</label>
                    <input type="time" id="tiempo" name="tiempo">
                </div>
                <div class="form-group">
                    <label for="ingles">Niver de Inglés</label>
                    <input type="range" id="ingles" name="ingles">
                </div>
                <div class="form-group">
                    <label>Preferencias</label>
                    <input type="checkbox" id="noticias" name="preferencias" value="noticias">
                    <label for="noticias">Recibir noticias</label>
                    <input type="checkbox" id="ofertas" name="preferencias" value="ofertas">
                    <label for="ofertas">Recibir ofertas</label>
                </div>
                <div class="form-group">
                    <label>Género Musical Favorito</label>
                    <input type="radio" id="rock" name="musica" value="rock">
                    <label for="rock">Rock</label>
                    <input type="radio" id="pop" name="musica" value="pop">
                    <label for="pop">Pop</label>
                    <input type="radio" id="jazz" name="musica" value="jazz">
                    <label for="jazz">Jazz</label>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Enviar</button>
                    <button type="reset">Reiniciar</button>
                </div>
            </form>
        </div>
    </main>
    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Javier Vadillo Gallego | Formulario
    </footer>
</body>

</html>
