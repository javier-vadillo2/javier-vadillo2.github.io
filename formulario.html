<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/formulario.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Formulario</h1>
        </div>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="18" max="100">
            </div>
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" name="fecha">
            </div>
            <div class="form-group">
                <label for="genero">Género</label>
                <select id="genero" name="genero">
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color favorito</label>
                <input class="color" type="color">
            </div>
            <div class="form-group">
                <label>Preferencias</label>
                <input type="checkbox" id="noticias" name="preferencias" value="noticias"> 
                <label for="noticias">Recibir noticias</label>
                <input type="checkbox" id="ofertas" name="preferencias" value="ofertas"> 
                <label for="ofertas">Recibir ofertas</label>
            </div>
            <div class="form-group">
                <label>Género Musical Favorito</label>
                <input type="radio" id="rock" name="musica" value="rock"> 
                <label for="rock">Rock</label>
                <input type="radio" id="pop" name="musica" value="pop"> 
                <label for="pop">Pop</label>
                <input type="radio" id="jazz" name="musica" value="jazz"> 
                <label for="jazz">Jazz</label>
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" required></textarea>
            </div>
            <div class="form-group">
                <button type="submit">Enviar</button>
                <button type="reset">Reiniciar</button>
            </div>
        </form>
        <div class="button-container">
            <a href="index.html">Volver a la página inicial</a>
        </div>
    </div>
</body>
</html>
